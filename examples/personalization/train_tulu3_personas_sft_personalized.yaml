### model
# 二阶段训练使用的基础模型路径。
# 这里不再直接使用最原始的 Qwen2.5-3B-Instruct，
# 而是使用“第一阶段全量 SFT LoRA merge 之后”的完整模型目录。
# 这样这一步 persona 子集训练就是真正的二阶段微调。
model_name_or_path: saves/qwen2.5-3b/merged/tulu3_personas_sft_full

# 是否信任模型仓库中的自定义代码。
trust_remote_code: true

### method
# 训练阶段。这里仍然做监督微调。
stage: sft

# 是否执行训练。
do_train: true

# 微调方式。
finetuning_type: lora

# LoRA 的秩。
lora_rank: 8

# LoRA 作用模块。
lora_target: all

### dataset
# 使用筛选后的 persona-conditioned 子集。
# 这一阶段的目标是基于第一阶段模型，继续强化 persona/profile 对齐能力。
dataset: tulu3_personas_sft_personalized

# Qwen2 / Qwen2.5 指令模型模板。
template: qwen

# 最大长度。
# 这里与第一阶段保持一致，避免两阶段因为长度设置不同而带来额外变量。
cutoff_len: 1536

# 是否覆盖旧缓存。
overwrite_cache: true

# 预处理并行进程数。
preprocessing_num_workers: 4

# DataLoader 进程数。
dataloader_num_workers: 0

### output
# 输出目录。
# 这里保存的是第二阶段 persona 子集微调得到的 LoRA adapter。
output_dir: saves/qwen2.5-3b/lora/tulu3_personas_sft_personalized

# 日志步数。
logging_steps: 10

# 保存步数。
# 子集更小，因此更频繁一些，便于回看中间 checkpoint。
save_steps: 100

# 是否绘制 loss 曲线。
plot_loss: true

# 是否覆盖已有输出目录。
overwrite_output_dir: true

# 是否仅保存模型文件。
save_only_model: false

# 实验上报到哪里。
report_to: none

### train
# 每张卡每步样本数。
# 这个值直接对应你直觉里的 batch_size，也就是一次前向/反向传播实际送进显卡的样本条数。
# 如果这里是 1，那么单步看到的输入第一维就是 1；如果这里是 2，那么单步第一维就是 2。
# 这个参数最直接影响显存占用。
per_device_train_batch_size: 1

# 梯度累计步数。
# 这个值表示“连续做多少个小 batch 的前向/反向传播后，再真正更新一次参数”。
# 它不会直接改变单步输入张量的 shape，但会改变多少个小 batch 合起来做一次优化器更新。
# 可以把它理解成：一次塞不下更大的 batch，就分几步算梯度，最后累计起来再更新。
# 在单卡下，有效 batch size = per_device_train_batch_size * gradient_accumulation_steps。
# 这里设成 8，表示每步虽然只喂 1 条，但累计 8 步梯度后再更新，等效 batch size 为 8。
gradient_accumulation_steps: 8

# 学习率。
learning_rate: 1.0e-4

# 训练轮数。
# persona 子集样本更少，二阶段先做 2 个 epoch，观察 persona 对齐是否进一步增强。
num_train_epochs: 3.0

# 学习率调度器。
lr_scheduler_type: cosine

# warmup 比例。
warmup_ratio: 0.1

# 是否启用 bf16。
bf16: true

# 如果 bf16 在远端不兼容，可改为：
# bf16: false
# fp16: true

# 分布式超时时间。
ddp_timeout: 180000000

# 从已有 checkpoint 恢复。
resume_from_checkpoint: null

### eval
# 从当前二阶段训练子集中再切出 2% 作为验证集。
# 比较样本已经提前从训练文件中剔除，这里的验证集只用于监控二阶段训练过程。
val_size: 0.02

# 验证时每张卡的 batch size。
per_device_eval_batch_size: 1

# 按 step 间隔执行验证。
eval_strategy: steps

# 每 100 步做一次验证。
eval_steps: 100
